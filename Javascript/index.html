<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Greeting based on time of day -->
     <h3>Example 1: Dynamic Greeting</h3>
     <div id="greetingOutput">
     </div>

     <!-- Show text when I click a button -->
      <h3>Example 2: Button Click Event Handling</h3>
     <button onclick="setButtonText()">Click Me</button>
     <div id="buttonClickText"></div>

     <button onclick="newButtonText()">CLICK ME AS WELL</button>
     <div id="newButtonText"></div>

     <h3>Example 3: Displaying the Date with Buttons</h3>
     <button onclick="setButtonTextDate()">NOW CLICK MEEEEEEEEEEEEEE, for Date and Time</button>
     <div id="buttonClickDate"></div>

     <h3>Example 4: JavaScript Numeric Values</h3>
     <label for="addNum1">First Number: </label>
     <input type="number" id="addNum1" name="addNum1">
     <br>
     <label for="addNum2">Second Number: </label>
     <input type="number" id="addNum2" name="addNum2">
     <br>
     <button onclick="addNumbers()">Add Them Together</button>
     <div id="sum"></div>

     <h3>Example 5:  Length of String</h3>
     <input type="text" id="userString" name="userString">
     <button onclick="getLength()">Try it</button>
     <div id="lengthOutput"></div>

     <h3>Example 6: Toggle password display</h3>
     <input type="text" id="password" name="password">
     <input onchange="revealPassword()" type="checkbox" id="showPassword">

     <script src="script.js"></script>
</body>
</html>
